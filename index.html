<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./cssReset.css" />

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main class="social-links-card">
      <div class="card-content">
        <div class="card-content__avatar">
          <img
            alt="A round profile picture of Jessica Randall."
            src="./assets/images/avatar-jessica.jpeg"
          />
        </div>
        <div class="card-content__header">
          <div class="heading">
            <h1>Jessica Randall</h1>
          </div>
          <div class="tagline">
            <p>London, United Kingdom</p>
          </div>
        </div>
        <div class="card-content__description">
          <p>"Front-end developer and avid reader."</p>
        </div>
        <menu class="card-content__links-list">
          <li><a href="http://">GitHub</a></li>
          <li><a href="http://">Frontend Mentor</a></li>
          <li><a href="http://">LinkedIn</a></li>
          <li><a href="http://">Twitter</a></li>
          <li><a href="http://">Instagram</a></li>
        </menu>
      </div>
    </main>
  </body>
</html>
