<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <div class="social-links-card">
      <div class="card-content">
        <div class="card-content__avatar">
          <img
            alt="A round profile picture of Jessica Randall."
            src="./assets/images/avatar-jessica.jpeg"
          />
        </div>
        <div class="card-content__header">
          <div class="heading">
            <h1>Jessica Randall</h1>
          </div>
          <div class="tagline">
            <p>London, United Kingdom</p>
          </div>
        </div>
        <div class="card-content__description">
          <p>"Front-end developer and avid reader."</p>
        </div>
        <div class="card-content__links-container">
          <a href="http://">GitHub</a>
          <a href="http://">Frontend Mentor</a>
          <a href="http://">LinkedIn</a>
          <a href="http://">Twitter</a>
          <a href="http://">Instagram</a>
        </div>
      </div>
    </div>
  </body>
</html>
